<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 即時翻譯機</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 引入 OpenCC-JS 用於確保顯示繁體中文 -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  <style>
    /* 自訂滾動條樣式 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* 聊天泡泡動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-[100dvh] flex flex-col overflow-hidden">

  <header class="bg-white shadow-sm border-b border-slate-200 px-4 md:px-6 py-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <button id="settingsBtn" type="button" class="bg-blue-600 hover:bg-blue-700 p-2 rounded-lg text-white shadow-md transition-colors" title="設定" aria-label="設定">
        <i data-lucide="settings"></i>
      </button>
      <h1 class="text-xl font-bold tracking-tight text-slate-800 hidden sm:block">
        Gemini 即時翻譯機 <span id="headerLangBadge" class="whitespace-nowrap text-sm font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded ml-2 border border-blue-200">翻譯成英文</span>
      </h1>
    </div>
    
    <div class="flex items-center gap-2 md:gap-3">
      <!-- 輸入語言選擇（選項由程式依目標語言清單產生，另加方言） -->
      <select id="sourceLangSelect" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm bg-white text-slate-700"></select>

      <!-- 目標語言選擇 -->
      <select id="targetLangSelect" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm bg-white text-slate-700">
        <optgroup label="常用">
          <option value="English" selected>目標：英文</option>
          <option value="Taiwanese Mandarin (Traditional Chinese)">目標：繁體中文</option>
          <option value="Japanese">目標：日文</option>
          <option value="Korean">目標：韓文</option>
        </optgroup>
        <optgroup label="亞洲">
          <option value="Thai">目標：泰文</option>
          <option value="Vietnamese">目標：越南文</option>
          <option value="Indonesian">目標：印尼文</option>
          <option value="Malay">目標：馬來文</option>
          <option value="Filipino">目標：菲律賓文</option>
          <option value="Hindi">目標：印地文</option>
          <option value="Arabic">目標：阿拉伯文</option>
          <option value="Turkish">目標：土耳其文</option>
        </optgroup>
        <optgroup label="歐洲">
          <option value="Spanish">目標：西班牙文</option>
          <option value="French">目標：法文</option>
          <option value="German">目標：德文</option>
          <option value="Italian">目標：義大利文</option>
          <option value="Portuguese">目標：葡萄牙文</option>
          <option value="Russian">目標：俄文</option>
          <option value="Dutch">目標：荷蘭文</option>
          <option value="Polish">目標：波蘭文</option>
        </optgroup>
      </select>

      <span id="statusBadge" class="flex items-center text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 transition-colors whitespace-nowrap">
        待機中
      </span>
    </div>
  </header>

  <main class="flex-1 w-full overflow-y-auto" id="scrollContainer">
  <div class="max-w-4xl w-full min-h-full mx-auto p-4 md:p-6 flex flex-col gap-4" id="transcriptContainer">
    
    <div id="errorAlert" class="hidden bg-red-50 border-red-500 border-l-4 p-4 rounded-md flex items-start gap-3 shrink-0">
      <i data-lucide="alert-circle" class="text-red-500 mt-0.5 shrink-0"></i>
      <p id="errorMsg" class="text-red-700 text-sm font-medium"></p>
    </div>

    <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center text-slate-400 gap-4 mt-10 transition-opacity">
      <div class="bg-slate-100 p-6 rounded-full border-2 border-dashed border-slate-200 relative">
        <i data-lucide="mic" class="w-12 h-12 text-slate-400"></i>
        <div class="absolute -bottom-2 -right-2 bg-blue-100 p-1.5 rounded-full border border-blue-200">
          <i data-lucide="languages" class="w-6 h-6 text-blue-600"></i>
        </div>
      </div>
      <p class="text-lg text-center leading-relaxed">
        點擊下方按鈕開始對話。<br/>
        可用 <span id="welcomeSourceLang" class="font-medium text-slate-600">任何語言</span> 說話，自動翻譯成 <span id="welcomeTargetLang" class="font-medium text-slate-600">英文</span>。
      </p>
    </div>

    <!-- 逐字稿將會動態插入這裡 -->
  </div>
  </main>

  <footer class="bg-white border-t border-slate-200 p-4 pb-[calc(1rem+env(safe-area-inset-bottom))] flex justify-center shadow-[0_-10px_40px_rgba(0,0,0,0.03)] shrink-0">
    <div class="w-full max-w-lg flex flex-col gap-3">
      <!-- 手動文字輸入（僅在翻譯進行中顯示） -->
      <div id="textInputBar" class="hidden items-center gap-2">
        <input
          type="text"
          id="manualTextInput"
          placeholder="輸入文字進行翻譯…"
          autocomplete="off"
          class="flex-1 text-sm border border-slate-300 rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm bg-white text-slate-800 placeholder:text-slate-400"
        />
        <button
          type="button"
          id="sendTextBtn"
          class="shrink-0 flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-full px-4 py-2.5 text-sm font-semibold transition-colors shadow-sm"
          title="送出文字翻譯"
        >
          <i data-lucide="send" class="w-4 h-4"></i>
          <span class="hidden sm:inline">送出</span>
        </button>
      </div>
      <button
        id="controlBtn"
        class="flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full px-8 py-3.5 md:py-4 text-lg font-semibold transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-600/30 w-full"
      >
        <i data-lucide="mic" id="btnIcon"></i>
        <span id="btnText">開始語音翻譯</span>
      </button>
    </div>
  </footer>

  <!-- 設定視窗 -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/40 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90dvh] flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 shrink-0">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-blue-600"></i>設定
        </h2>
        <button id="settingsCloseBtn" type="button" class="p-1.5 rounded-md text-slate-500 hover:bg-slate-100" aria-label="關閉">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="px-5 py-4 flex flex-col gap-5 overflow-y-auto">
        <p id="settingsLockedNote" class="hidden text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-3 py-2">
          翻譯進行中無法修改設定，請先停止翻譯。
        </p>

        <section class="flex flex-col gap-1.5">
          <label for="apiKeyInput" class="text-sm font-semibold text-slate-700">Gemini API Key</label>
          <input
            type="password"
            id="apiKeyInput"
            placeholder="輸入 Gemini API Key..."
            autocomplete="off"
            class="text-sm border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100"
          />
          <p class="text-xs text-slate-400">只儲存在這台裝置的瀏覽器中。</p>
        </section>

        <section class="flex flex-col gap-1.5">
          <label for="voiceSelect" class="text-sm font-semibold text-slate-700">發音員</label>
          <select id="voiceSelect" class="text-sm border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700 disabled:bg-slate-100"></select>
          <div class="flex gap-2">
            <button id="previewVoiceBtn" type="button" class="flex items-center gap-1.5 text-sm border border-slate-300 rounded-md px-3 py-1.5 text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">
              <i data-lucide="play" class="w-4 h-4"></i>試聽
            </button>
            <button id="loadVoicesBtn" type="button" class="flex items-center gap-1.5 text-sm border border-slate-300 rounded-md px-3 py-1.5 text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>載入我的自訂語音
            </button>
          </div>
          <p id="voiceStatus" class="text-xs text-slate-500"></p>
        </section>

        <section class="flex flex-col gap-1.5">
          <label for="styleSelect" class="text-sm font-semibold text-slate-700">語氣</label>
          <select id="styleSelect" class="text-sm border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700 disabled:bg-slate-100">
            <option value="naturally">自然語氣</option>
            <option value="cheerfully and excitedly">熱情歡樂</option>
            <option value="professionally and calmly">專業冷靜</option>
            <option value="like a news anchor">新聞主播</option>
          </select>
        </section>

        <section class="flex flex-col gap-2 border-t border-slate-200 pt-4">
          <h3 class="text-sm font-semibold text-slate-700">設計新語音（Voice Design）</h3>
          <p class="text-xs text-slate-400">用文字描述年齡、性別、音色與口音，建立後會存在你的 Gemini 專案中。</p>
          <input
            type="text"
            id="designNameInput"
            placeholder="語音名稱，例如：溫暖的導遊"
            class="text-sm border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100"
          />
          <select id="designGenderSelect" class="text-sm border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700 disabled:bg-slate-100">
            <option value="female">女性</option>
            <option value="male">男性</option>
          </select>
          <textarea
            id="designPromptInput"
            rows="3"
            placeholder="例如：A warm, friendly tour guide in her 30s with a clear, gentle voice."
            class="text-sm border border-slate-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100"
          ></textarea>
          <button id="createVoiceBtn" type="button" class="self-start flex items-center gap-1.5 text-sm bg-emerald-600 hover:bg-emerald-700 text-white rounded-md px-3 py-1.5 font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
            <i data-lucide="wand-sparkles" class="w-4 h-4"></i>建立並試聽
          </button>
          <p id="designStatus" class="text-xs text-slate-500"></p>
        </section>
      </div>

      <div class="px-5 py-4 border-t border-slate-200 flex justify-end shrink-0">
        <button id="settingsDoneBtn" type="button" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 text-sm font-semibold">完成</button>
      </div>
    </div>
  </div>

  <script type="module">
    // 動態載入 Google GenAI SDK
    import { GoogleGenAI, Modality } from 'https://esm.sh/@google/genai';

    // 初始化繁簡轉換器 (簡體轉台灣繁體，包含慣用語)
    const cn2tw = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'twp' }) : (text) => text;

    lucide.createIcons();

    // DOM 元素參考
    const apiKeyInput = document.getElementById('apiKeyInput');
    const statusBadge = document.getElementById('statusBadge');
    const errorAlert = document.getElementById('errorAlert');
    const errorMsg = document.getElementById('errorMsg');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const transcriptContainer = document.getElementById('transcriptContainer');
    const scrollContainer = document.getElementById('scrollContainer');
    const controlBtn = document.getElementById('controlBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const voiceSelect = document.getElementById('voiceSelect');
    const styleSelect = document.getElementById('styleSelect');
    const targetLangSelect = document.getElementById('targetLangSelect');
    const headerLangBadge = document.getElementById('headerLangBadge');
    const welcomeTargetLang = document.getElementById('welcomeTargetLang');
    const sourceLangSelect = document.getElementById('sourceLangSelect');
    const welcomeSourceLang = document.getElementById('welcomeSourceLang');
    const textInputBar = document.getElementById('textInputBar');
    const manualTextInput = document.getElementById('manualTextInput');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const settingsDoneBtn = document.getElementById('settingsDoneBtn');
    const settingsLockedNote = document.getElementById('settingsLockedNote');
    const previewVoiceBtn = document.getElementById('previewVoiceBtn');
    const loadVoicesBtn = document.getElementById('loadVoicesBtn');
    const voiceStatus = document.getElementById('voiceStatus');
    const designNameInput = document.getElementById('designNameInput');
    const designGenderSelect = document.getElementById('designGenderSelect');
    const designPromptInput = document.getElementById('designPromptInput');
    const createVoiceBtn = document.getElementById('createVoiceBtn');
    const designStatus = document.getElementById('designStatus');

    // 處理語言切換事件
    const langNameMap = {
      'English': '英文',
      'Taiwanese Mandarin (Traditional Chinese)': '繁體中文',
      'Japanese': '日文',
      'Korean': '韓文',
      'Thai': '泰文',
      'Vietnamese': '越南文',
      'Indonesian': '印尼文',
      'Malay': '馬來文',
      'Filipino': '菲律賓文',
      'Hindi': '印地文',
      'Arabic': '阿拉伯文',
      'Turkish': '土耳其文',
      'Spanish': '西班牙文',
      'French': '法文',
      'German': '德文',
      'Italian': '義大利文',
      'Portuguese': '葡萄牙文',
      'Russian': '俄文',
      'Dutch': '荷蘭文',
      'Polish': '波蘭文',
      'Taiwanese Hokkien': '台語',
      'Taiwanese Hakka': '客語',
      'Cantonese': '粵語',
      'auto': '自動偵測'
    };

    const CHINESE_LANG = 'Taiwanese Mandarin (Traditional Chinese)';

    // 語音轉錄用的 BCP-47 代碼；方言沒有對應代碼，轉錄改為自動偵測
    const langCodeMap = {
      'English': 'en-US',
      'Taiwanese Mandarin (Traditional Chinese)': 'zh-TW',
      'Japanese': 'ja-JP',
      'Korean': 'ko-KR',
      'Thai': 'th-TH',
      'Vietnamese': 'vi-VN',
      'Indonesian': 'id-ID',
      'Malay': 'ms-MY',
      'Filipino': 'fil-PH',
      'Hindi': 'hi-IN',
      'Arabic': 'ar-SA',
      'Turkish': 'tr-TR',
      'Spanish': 'es-ES',
      'French': 'fr-FR',
      'German': 'de-DE',
      'Italian': 'it-IT',
      'Portuguese': 'pt-BR',
      'Russian': 'ru-RU',
      'Dutch': 'nl-NL',
      'Polish': 'pl-PL'
    };

    // 方言：AI 回譯給說方言的人時改用華語
    const DIALECTS = ['Taiwanese Hokkien', 'Taiwanese Hakka', 'Cantonese'];
    const DIALECT_REPLY_LANG = {
      'Taiwanese Hokkien': CHINESE_LANG,
      'Taiwanese Hakka': CHINESE_LANG,
    };

    function buildSourceLangOptions() {
      sourceLangSelect.appendChild(new Option('輸入：自動偵測', 'auto', true, true));
      const groups = [...targetLangSelect.querySelectorAll('optgroup')];
      const addGroup = (label, values) => {
        const group = document.createElement('optgroup');
        group.label = label;
        for (const value of values) group.appendChild(new Option('輸入：' + langNameMap[value], value));
        sourceLangSelect.appendChild(group);
      };
      groups.forEach((g, i) => {
        addGroup(g.label, [...g.querySelectorAll('option')].map((o) => o.value));
        if (i === 0) addGroup('方言', DIALECTS);
      });
    }

    function updateLangLabels() {
      const sourceZh = langNameMap[sourceLangSelect.value];
      const targetZh = langNameMap[targetLangSelect.value];
      const isAuto = sourceLangSelect.value === 'auto';
      welcomeSourceLang.textContent = isAuto ? '任何語言' : sourceZh;
      welcomeTargetLang.textContent = targetZh;
      headerLangBadge.textContent = isAuto ? '翻譯成' + targetZh : `${sourceZh} → ${targetZh}`;
    }

    buildSourceLangOptions();
    sourceLangSelect.addEventListener('change', updateLangLabels);
    targetLangSelect.addEventListener('change', updateLangLabels);

    // 本次連線使用的輸入語言（連線中選單會鎖定）
    let activeSourceLang = 'auto';

    // 狀態變數
    let isSessionActive = false;
    let isConnecting = false;
    let session = null;
    let inputAudioContext = null;
    let outputAudioContext = null;
    let stream = null;
    let audioSources = new Set();
    let nextStartTime = 0;
    
    // 防回音機制：記錄目前有幾個音軌正在播放
    let activePlaybackCount = 0; 

    // 暫存轉錄文字
    let currentInputText = '';
    let currentOutputText = '';
    let transcriptIdCounter = 0;

    // 暫存本輪 AI 語音，供重複播放
    let currentTurnAudioBuffers = [];
    const transcriptAudioMap = new Map();

    // 本輪是否為手動文字輸入（手動輸入不需校正）
    let currentInputIsManual = false;

    // 校正右側轉錄用的文字模型（選用輕量模型以降低延遲）
    const VERIFY_MODEL = 'gemini-flash-lite-latest';
    const VERIFY_TIMEOUT_MS = 8000;
    let aiClient = null;

    // 本輪正在串流顯示的逐字稿區塊
    let liveTranscriptEl = null;

    const savedKey = localStorage.getItem('gemini_api_key_html');
    if (savedKey) apiKeyInput.value = savedKey;
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key_html', apiKeyInput.value.trim());
    });

    // ===== 發音員（內建語音 + Voice Design 自訂語音） =====
    const PREBUILT_VOICES = [
      ['Zephyr', '明亮'], ['Puck', '活潑'], ['Charon', '專業'], ['Kore', '堅定'],
      ['Fenrir', '熱情'], ['Leda', '年輕'], ['Orus', '沉穩'], ['Aoede', '輕鬆'],
      ['Callirrhoe', '隨和'], ['Autonoe', '明亮'], ['Enceladus', '氣聲'], ['Iapetus', '清晰'],
      ['Umbriel', '隨和'], ['Algieba', '柔順'], ['Despina', '柔順'], ['Erinome', '清晰'],
      ['Algenib', '沙啞'], ['Rasalgethi', '知性'], ['Laomedeia', '活潑'], ['Achernar', '柔和'],
      ['Alnilam', '堅定'], ['Schedar', '平穩'], ['Gacrux', '成熟'], ['Pulcherrima', '積極'],
      ['Achird', '友善'], ['Zubenelgenubi', '隨興'], ['Vindemiatrix', '溫柔'], ['Sadachbia', '生動'],
      ['Sadaltager', '博學'], ['Sulafat', '溫暖'],
    ];
    const VOICE_DESIGN_MODEL = 'gemini-3.8-flash-tts';
    const VOICE_KEY = 'gemini_voice_html';
    const VOICE_LABEL_KEY = 'gemini_voice_label_html';
    const VOICE_CUSTOM_KEY = 'gemini_voice_custom_html';
    const STYLE_KEY = 'gemini_style_html';

    const customVoiceGroup = document.createElement('optgroup');
    customVoiceGroup.label = '我的自訂語音';

    function addCustomVoiceOption(id, label) {
      let opt = [...customVoiceGroup.children].find((o) => o.value === id);
      if (!opt) {
        opt = new Option(label, id);
        opt.dataset.custom = '1';
        customVoiceGroup.appendChild(opt);
      } else {
        opt.textContent = label;
      }
      return opt;
    }

    function selectedVoiceIsCustom() {
      return voiceSelect.selectedOptions[0]?.dataset.custom === '1';
    }

    function saveVoiceChoice() {
      localStorage.setItem(VOICE_KEY, voiceSelect.value);
      localStorage.setItem(VOICE_LABEL_KEY, voiceSelect.selectedOptions[0]?.textContent || voiceSelect.value);
      localStorage.setItem(VOICE_CUSTOM_KEY, selectedVoiceIsCustom() ? '1' : '');
      previewVoiceBtn.disabled = !selectedVoiceIsCustom() || isSessionActive || isConnecting;
      voiceStatus.textContent = selectedVoiceIsCustom() ? '' : '內建語音沒有試聽音檔；自訂語音可以試聽。';
    }

    function buildVoiceOptions() {
      const prebuiltGroup = document.createElement('optgroup');
      prebuiltGroup.label = '內建語音';
      for (const [name, desc] of PREBUILT_VOICES) prebuiltGroup.appendChild(new Option(`${name}（${desc}）`, name));
      voiceSelect.appendChild(prebuiltGroup);
      voiceSelect.appendChild(customVoiceGroup);

      const savedVoice = localStorage.getItem(VOICE_KEY) || 'Zephyr';
      if (localStorage.getItem(VOICE_CUSTOM_KEY) === '1') {
        addCustomVoiceOption(savedVoice, localStorage.getItem(VOICE_LABEL_KEY) || savedVoice);
      }
      voiceSelect.value = savedVoice;
      if (!voiceSelect.value) voiceSelect.value = 'Zephyr';

      const savedStyle = localStorage.getItem(STYLE_KEY);
      if (savedStyle) styleSelect.value = savedStyle;
      if (!styleSelect.value) styleSelect.value = 'naturally';
    }

    function getSettingsClient() {
      const key = apiKeyInput.value.trim();
      if (!key) throw new Error('請先輸入 API Key。');

    function decodeBase64(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    async function decodeAudioData(data, ctx, sampleRate, numChannels) {
      const dataInt16 = new Int16Array(data.buffer);
      const frameCount = dataInt16.length / numChannels;
      const buffer = ctx.createBuffer(numChannels, frameCount, sampleRate);
      for (let channel = 0; channel < numChannels; channel++) {
        const channelData = buffer.getChannelData(channel);
        for (let i = 0; i < frameCount; i++) {
          channelData[i] = dataInt16[i * numChannels + channel] / 32768.0;
        }
      }
      return buffer;
    }

    function encodeBase64(bytes) {
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function createBlob(data) {
      const l = data.length;
      const int16 = new Int16Array(l);
      for (let i = 0; i < l; i++) {
        int16[i] = data[i] * 32768;
      }
      return {
        data: encodeBase64(new Uint8Array(int16.buffer)),
        mimeType: 'audio/pcm;rate=16000',
      };
    }

    // 日文假名或韓文不可經過 OpenCC，否則日文漢字會被改成中文字形
    function toDisplayText(text) {
      if (/[\u3040-\u30ff\uac00-\ud7af]/.test(text)) return text;
      return cn2tw(text);
    }

    // 含漢字且沒有日文假名、韓文，視為中文
    function isChineseText(text) {
      return /[\u4e00-\u9fff]/.test(text) && !/[\u3040-\u30ff\uac00-\ud7af]/.test(text);
    }

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(`逾時 ${ms / 1000} 秒`)), ms)),
      ]);
    }

    async function translateToChinese(text) {
      const res = await withTimeout(aiClient.models.generateContent({
        model: VERIFY_MODEL,
        contents: `Translate the following text into Traditional Chinese as used in Taiwan. Reply with only the translation.\n\n${text}`,
      }), VERIFY_TIMEOUT_MS);
      return (res.text || '').trim();
    }

    // 決定右側要顯示的文字：轉錄與左側翻譯意思不符（如台語被誤聽）時，改用左側翻譯的中文意思；失敗時回傳原始轉錄
    async function resolveInputText(rawInput, outputText, languageHint = '') {
      if (!aiClient) return rawInput;
      const translation = outputText.trim();
      const translationInChinese = () =>
        isChineseText(translation) ? translation : translateToChinese(translation);

      try {
        let chinese = '';
        if (!rawInput.trim()) {
          chinese = await translationInChinese();
        } else {
          const prompt = `A live interpreter app shows a speech-recognition transcript of what the speaker said, next to the interpreter's translation. The translation is reliable. The transcript is often wrong for dialects such as Taiwanese Hokkien, which gets mis-transcribed as unrelated Mandarin characters (e.g. "給那個弟弟進喝" for "今仔日天氣真好", meaning "Today's weather is very good").
${languageHint}

Transcript: """${rawInput}"""
Translation: """${translation}"""

If the transcript is a coherent sentence whose meaning matches the translation, reply {"match": true}.
Otherwise reply {"match": false, "chinese": "<the translation's meaning in Traditional Chinese as used in Taiwan>"}.`;

          const res = await withTimeout(aiClient.models.generateContent({
            model: VERIFY_MODEL,
            contents: prompt,
            config: { responseMimeType: 'application/json' },
          }), VERIFY_TIMEOUT_MS);
          const result = JSON.parse(res.text || '{}');
          if (result.match !== false) return rawInput;
          chinese = (result.chinese || '').trim();
          if (!isChineseText(chinese)) chinese = await translationInChinese();
        }
        return chinese || rawInput;
      } catch (err) {
        console.error('右側文字校正失敗：', err);
        return rawInput;
      }
    }

    // which 為 'input'（右側）或 'output'（左側）；文字為空時隱藏該泡泡
    function setBubbleText(div, which, text, pending = false) {
      const bubble = div.querySelector(`.${which}-bubble`);
      const textEl = bubble.querySelector(`.${which}-text`);

    // 指定一般語言時轉錄已鎖定語言，不需校正；自動偵測或方言才需要
    function inputNeedsVerification() {

    }

    function renderLiveInput() {
      const div = ensureLiveTranscript();
      if (currentInputIsManual || !inputNeedsVerification()) {

    async function replayTranscriptAudio(id) {
      const buffers = transcriptAudioMap.get(id);
      if (!buffers || buffers.length === 0) return;

      let ctx = outputAudioContext;
      let createdTempContext = false;
      if (!ctx || ctx.state === 'closed') {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        createdTempContext = true;
      }
      if (ctx.state === 'suspended') {
        await ctx.resume();
      }

      const gain = ctx.createGain();
      gain.connect(ctx.destination);

      let startAt = ctx.currentTime;
      for (const buffer of buffers) {
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(gain);

        activePlaybackCount++;
        updateUIStatus();

        source.addEventListener('ended', () => {
          activePlaybackCount = Math.max(0, activePlaybackCount - 1);
          updateUIStatus();
          if (createdTempContext && activePlaybackCount === 0) {
            ctx.close();
          }
        });

        source.start(startAt);
        startAt += buffer.duration;
      }
    }

    async function startSession() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        showError('請先在設定中輸入您的 Gemini API Key。');
        openSettings();
        return;
      }
      if (sourceLangSelect.value === targetLangSelect.value) {
        showError('輸入語言與目標語言不能相同。');
        return;
      }
      localStorage.setItem('gemini_api_key_html', apiKey);
      activeSourceLang = sourceLangSelect.value;
      
      hideError();
      isConnecting = true;
      activePlaybackCount = 0;
      updateUIStatus();

      try {
        const ai = new GoogleGenAI({ apiKey: apiKey });
        aiClient = ai;

        inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        outputAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        nextStartTime = 0;

        const workletCode = `
          class RecorderProcessor extends AudioWorkletProcessor {
            process(inputs, outputs, parameters) {
              const input = inputs[0];
              if (input.length > 0) {
                this.port.postMessage(input[0]);
              }
              return true;
            }
          }
          registerProcessor('recorder-processor', RecorderProcessor);
        `;
        const workletDataUrl = 'data:application/javascript;base64,' + btoa(workletCode);
        await inputAudioContext.audioWorklet.addModule(workletDataUrl);

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true, // 保留硬體降噪作為第一層防護
            noiseSuppression: true,
            autoGainControl: true,
          }
        });

        const outputNode = outputAudioContext.createGain();
        outputNode.connect(outputAudioContext.destination);

        const selectedVoice = voiceSelect.value;
        const selectedStyle = styleSelect.value;
        const targetLang = targetLangSelect.value;
        const sourceLang = activeSourceLang;
        const closing = 'Do not answer questions, do not hold a conversation, do not add any extra commentary. Just listen and output the exact translation.';

        let instruction;
        if (sourceLang === 'auto') {
          // 輸入語音不限語種，一律翻譯成選定的目標語言；說的就是目標語言時改譯成備用語言
          const fallbackLang = targetLang === CHINESE_LANG ? 'English' : CHINESE_LANG;
          instruction = `You are a highly skilled real-time interpreter.
The user may speak in ANY language. Automatically detect the spoken language.

If the user speaks any language other than ${targetLang}, translate it exactly into ${targetLang} and speak the ${targetLang} translation ${selectedStyle}.
If the user speaks ${targetLang}, translate it exactly into ${fallbackLang} and speak the ${fallbackLang} translation ${selectedStyle}.

${closing}`;
        } else {
          // 指定輸入語言：兩人對話，A 說輸入語言、B 說目標語言
          const replyLang = DIALECT_REPLY_LANG[sourceLang] || sourceLang;
          const dialectNote = DIALECTS.includes(sourceLang)
            ? `${sourceLang} is a spoken Chinese dialect that may sound similar to Mandarin. Always interpret Person A's speech as ${sourceLang}, not Mandarin.\n`
            : '';
          instruction = `You are a highly skilled real-time interpreter between two people.
Person A speaks ${sourceLang}. Person B speaks ${targetLang}.
${dialectNote}
When you hear ${sourceLang}, translate it exactly into ${targetLang} and speak the ${targetLang} translation ${selectedStyle}.
When you hear ${targetLang}, translate it exactly into ${replyLang} and speak the ${replyLang} translation ${selectedStyle}.

${closing}`;
        }

        const transcriptionCodes = langCodeMap[sourceLang]
          ? [...new Set([langCodeMap[sourceLang], langCodeMap[targetLang]])]
          : [];

        session = ai.live.connect({
          model: 'gemini-3.1-flash-live-preview',
          config: {
            responseModalities: [Modality.AUDIO],
            systemInstruction: instruction,
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } }
            },
            inputAudioTranscription: {
              languageCodes: transcriptionCodes,
            },
            outputAudioTranscription: {},
          },
          callbacks: {
            onopen: () => {
              isConnecting = false;
              isSessionActive = true;
              updateUIStatus();
              
              const source = inputAudioContext.createMediaStreamSource(stream);
              const recorder = new AudioWorkletNode(inputAudioContext, 'recorder-processor');

              recorder.port.onmessage = (event) => {
                let inputData = event.data;
                
                // 【核心防回音機制：Software Mute】
                // 當喇叭正在播放 AI 翻譯結果時，強制將麥克風資料清零 (傳送靜音包)
                // 這樣 Gemini 就不會聽到自己的聲音，100% 避免誤判迴圈！
                if (activePlaybackCount > 0) {
                   inputData = new Float32Array(inputData.length); // 產生全為 0 的靜音陣列
                }
                
                const pcmBlob = createBlob(inputData);
                session.then((s) => s.sendRealtimeInput({ audio: pcmBlob }));
              };

              source.connect(recorder);
              recorder.connect(inputAudioContext.destination);
            },
            onmessage: async (message) => {
              if (message.serverContent?.inputTranscription) {
                currentInputText += message.serverContent.inputTranscription.text;
                if (currentInputText.trim()) renderLiveInput();
              }
              if (message.serverContent?.outputTranscription) {
                currentOutputText += message.serverContent.outputTranscription.text;
                if (currentOutputText.trim()) {
                  setBubbleText(ensureLiveTranscript(), 'output', toDisplayText(currentOutputText));
                }
              }

              const base64EncodedAudioString = message.serverContent?.modelTurn?.parts[0]?.inlineData?.data;
              if (base64EncodedAudioString) {
                nextStartTime = Math.max(nextStartTime, outputAudioContext.currentTime);
                
                const audioBuffer = await decodeAudioData(
                  decodeBase64(base64EncodedAudioString),
                  outputAudioContext,
                  24000,
                  1,
                );

                // 保留本輪音訊，供翻譯泡泡上的重複播放使用
                currentTurnAudioBuffers.push(audioBuffer);
                
                const source = outputAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(outputNode);
                
                source.addEventListener('ended', () => {
                  audioSources.delete(source);
                  activePlaybackCount = Math.max(0, activePlaybackCount - 1);
                  updateUIStatus(); // 更新 UI 狀態，解除靜音 Badge
                });

                source.start(nextStartTime);
                nextStartTime = nextStartTime + audioBuffer.duration;
                audioSources.add(source);
                
                // 標記開始播放，啟動麥克風靜音防回音機制
                activePlaybackCount++;
                updateUIStatus(); 
              }
              
              if (message.serverContent?.turnComplete) {
                 if (currentInputText.trim() || currentOutputText.trim()) {
                    const div = ensureLiveTranscript();
                    const id = Number(div.dataset.transcriptId);
                    const rawInput = currentInputText;
                    const outputText = currentOutputText;

                    if (currentTurnAudioBuffers.length > 0) {
                      transcriptAudioMap.set(id, currentTurnAudioBuffers.slice());
                      div.querySelector('.replay-audio-btn').classList.remove('hidden');
                    }

                    const shouldVerify = inputNeedsVerification() && !currentInputIsManual && outputText.trim() !== '';
                    if (shouldVerify) {
                      setBubbleText(div, 'input', '…', true);
                      const languageHint = activeSourceLang === 'auto'
                        ? ''
                        : `The speaker used either ${activeSourceLang} or ${targetLangSelect.value}. ${activeSourceLang} has no standard written form here, so its transcript is unreliable.`;
                      resolveInputText(rawInput, outputText, languageHint).then((finalInput) => {
                        setBubbleText(div, 'input', finalInput.trim() ? toDisplayText(finalInput) : '');
                      });
                    } else {
                      setBubbleText(div, 'input', rawInput.trim() ? toDisplayText(rawInput) : '');
                    }
                 } else if (liveTranscriptEl) {
                    liveTranscriptEl.remove();
                 }
                 liveTranscriptEl = null;
                 currentInputText = '';
                 currentOutputText = '';
                 currentTurnAudioBuffers = [];
                 currentInputIsManual = false;
              }

              if (message.serverContent?.interrupted) {
                for (const source of audioSources.values()) {
                  source.stop();
                }
                audioSources.clear();
                activePlaybackCount = 0;
                nextStartTime = 0;
                currentTurnAudioBuffers = [];
                updateUIStatus();
              }
            },
            onerror: (e) => {
              console.error('Session error:', e);
              showError('連線發生錯誤，請稍後再試。');
              stopSession();
            },
            onclose: () => {
              console.log('Session closed');
              stopSession();
            },
          }
        });
        
        session.catch(err => {
          showError('連線失敗：' + (err.message || err.toString()));
          stopSession();
        });

      } catch (err) {
        console.error(err);
        showError('無法啟動連線或取得麥克風權限：' + err.message);
        stopSession();
      }
    }

    function stopSession() {
      isSessionActive = false;
      isConnecting = false;
      activePlaybackCount = 0;
      
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      
      if (inputAudioContext) {
        inputAudioContext.close();
        inputAudioContext = null;
      }
      if (outputAudioContext) {
        outputAudioContext.close();
        outputAudioContext = null;
      }
      
      for (const source of audioSources.values()) {
        source.stop();
      }
      audioSources.clear();
      
      if (liveTranscriptEl) {
        if (!currentInputText.trim() && !currentOutputText.trim()) {
          liveTranscriptEl.remove();
        } else {
          setBubbleText(liveTranscriptEl, 'input', currentInputText.trim() ? toDisplayText(currentInputText) : '');
        }
      }
      liveTranscriptEl = null;
      currentInputText = '';
      currentOutputText = '';
      currentTurnAudioBuffers = [];
      currentInputIsManual = false;
      
      updateUIStatus();
    }

    controlBtn.addEventListener('click', () => {
      if (isConnecting) return;
      if (isSessionActive) {
        stopSession();
      } else {
        startSession();
      }
    });

    async function sendManualText() {
      const text = manualTextInput.value.trim();
      if (!text || !isSessionActive || !session) return;

      // 手動輸入沒有麥克風轉錄，先寫入本輪輸入文字以便逐字稿顯示
      currentInputText = text;
      currentInputIsManual = true;
      manualTextInput.value = '';
      renderLiveInput();

      try {
        const s = await session;
        // 以完整一輪文字送出，觸發翻譯語音回覆
        if (typeof s.sendClientContent === 'function') {
          s.sendClientContent({
            turns: [{ role: 'user', parts: [{ text }] }],
            turnComplete: true,
          });
        } else {
          s.sendRealtimeInput({ text });
        }
      } catch (err) {
        console.error(err);
        showError('文字送出失敗：' + (err.message || err.toString()));
      }
    }

    sendTextBtn.addEventListener('click', () => {
      sendManualText();
    });

    manualTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        sendManualText();
      }
    });

  </script>
</body>
</html>
