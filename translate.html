<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 即時雙向翻譯機</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 引入 OpenCC-JS 用於確保顯示繁體中文 -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  <style>
    /* 自訂滾動條樣式 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* 聊天泡泡動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-[100dvh] flex flex-col overflow-hidden">

  <header class="bg-white shadow-sm border-b border-slate-200 px-4 md:px-6 py-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white shadow-md">
        <i data-lucide="arrow-left-right"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-slate-800 hidden sm:block">
        Gemini 即時翻譯機 <span id="headerLangBadge" class="text-sm font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded ml-2 border border-blue-200">英中雙向</span>
      </h1>
    </div>
    
    <div class="flex items-center gap-2 md:gap-3">
      <!-- 目標語言選擇 -->
      <select id="targetLangSelect" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm bg-white text-slate-700">
        <option value="English" selected>英中雙向</option>
        <option value="Japanese">日中雙向</option>
        <option value="Korean">韓中雙向</option>
        <option value="Thai">泰中雙向</option>
        <option value="Spanish">西中雙向</option>
        <option value="French">法中雙向</option>
      </select>

      <!-- Voice Design: 選擇人聲與語氣設定 -->
      <select id="voiceSelect" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm hidden md:block bg-white text-slate-700">
        <option value="Puck">Puck (活潑)</option>
        <option value="Charon">Charon (專業)</option>
        <option value="Kore">Kore (堅定)</option>
        <option value="Fenrir">Fenrir (熱情)</option>
        <option value="Aoede">Aoede (輕鬆)</option>
        <option value="Zephyr" selected>Zephyr (明亮)</option>
      </select>
      <select id="styleSelect" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm hidden md:block bg-white text-slate-700">
        <option value="naturally">自然語氣</option>
        <option value="cheerfully and excitedly">熱情歡樂</option>
        <option value="professionally and calmly">專業冷靜</option>
        <option value="like a news anchor">新聞主播</option>
      </select>
      <input
        type="password"
        id="apiKeyInput"
        placeholder="輸入 Gemini API Key..."
        class="text-sm border border-slate-300 rounded-md px-3 py-1.5 w-48 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
      />
      <span id="statusBadge" class="flex items-center text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 transition-colors whitespace-nowrap">
        待機中
      </span>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-4 overflow-y-auto" id="transcriptContainer">
    
    <div id="errorAlert" class="hidden bg-red-50 border-red-500 border-l-4 p-4 rounded-md flex items-start gap-3 shrink-0">
      <i data-lucide="alert-circle" class="text-red-500 mt-0.5 shrink-0"></i>
      <p id="errorMsg" class="text-red-700 text-sm font-medium"></p>
    </div>

    <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center text-slate-400 gap-4 mt-10 transition-opacity">
      <div class="bg-slate-100 p-6 rounded-full border-2 border-dashed border-slate-200 relative">
        <i data-lucide="mic" class="w-12 h-12 text-slate-400"></i>
        <div class="absolute -bottom-2 -right-2 bg-blue-100 p-1.5 rounded-full border border-blue-200">
          <i data-lucide="languages" class="w-6 h-6 text-blue-600"></i>
        </div>
      </div>
      <p class="text-lg text-center leading-relaxed">
        點擊下方按鈕開始對話。<br/>
        支援 <span class="font-medium text-slate-600">中文</span> 與 <span id="welcomeTargetLang" class="font-medium text-slate-600">英文</span> 雙向自動偵測。
      </p>
    </div>

    <!-- 逐字稿將會動態插入這裡 -->
  </main>

  <footer class="bg-white border-t border-slate-200 p-4 pb-[calc(1rem+env(safe-area-inset-bottom))] flex justify-center shadow-[0_-10px_40px_rgba(0,0,0,0.03)] shrink-0">
    <button
      id="controlBtn"
      class="flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full px-8 py-3.5 md:py-4 text-lg font-semibold transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-600/30 w-full max-w-sm"
    >
      <i data-lucide="mic" id="btnIcon"></i>
      <span id="btnText">開始語音翻譯</span>
    </button>
  </footer>

  <script type="module">
    // 動態載入 Google GenAI SDK
    import { GoogleGenAI, Modality } from 'https://esm.sh/@google/genai';

    // 初始化繁簡轉換器 (簡體轉台灣繁體，包含慣用語)
    const cn2tw = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'twp' }) : (text) => text;

    lucide.createIcons();

    // DOM 元素參考
    const apiKeyInput = document.getElementById('apiKeyInput');
    const statusBadge = document.getElementById('statusBadge');
    const errorAlert = document.getElementById('errorAlert');
    const errorMsg = document.getElementById('errorMsg');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const transcriptContainer = document.getElementById('transcriptContainer');
    const controlBtn = document.getElementById('controlBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const voiceSelect = document.getElementById('voiceSelect');
    const styleSelect = document.getElementById('styleSelect');
    const targetLangSelect = document.getElementById('targetLangSelect');
    const headerLangBadge = document.getElementById('headerLangBadge');
    const welcomeTargetLang = document.getElementById('welcomeTargetLang');

    // 處理語言切換事件
    const langNameMap = {
      'English': '英文',
      'Japanese': '日文',
      'Korean': '韓文',
      'Thai': '泰文',
      'Spanish': '西班牙文',
      'French': '法文'
    };

    targetLangSelect.addEventListener('change', (e) => {
      const langZh = langNameMap[e.target.value];
      welcomeTargetLang.textContent = langZh;
      headerLangBadge.textContent = langZh.substring(0, 1) + '中雙向'; // 取第一個字，例如：英中雙向、日中雙向
    });

    // 狀態變數
    let isSessionActive = false;
    let isConnecting = false;
    let session = null;
    let inputAudioContext = null;
    let outputAudioContext = null;
    let stream = null;
    let audioSources = new Set();
    let nextStartTime = 0;
    
    // 防回音機制：記錄目前有幾個音軌正在播放
    let activePlaybackCount = 0; 

    // 暫存轉錄文字
    let currentInputText = '';
    let currentOutputText = '';
    let transcriptIdCounter = 0;

    const savedKey = localStorage.getItem('gemini_api_key_html');
    if (savedKey) apiKeyInput.value = savedKey;

    function decodeBase64(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    async function decodeAudioData(data, ctx, sampleRate, numChannels) {
      const dataInt16 = new Int16Array(data.buffer);
      const frameCount = dataInt16.length / numChannels;
      const buffer = ctx.createBuffer(numChannels, frameCount, sampleRate);
      for (let channel = 0; channel < numChannels; channel++) {
        const channelData = buffer.getChannelData(channel);
        for (let i = 0; i < frameCount; i++) {
          channelData[i] = dataInt16[i * numChannels + channel] / 32768.0;
        }
      }
      return buffer;
    }

    function encodeBase64(bytes) {
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function createBlob(data) {
      const l = data.length;
      const int16 = new Int16Array(l);
      for (let i = 0; i < l; i++) {
        int16[i] = data[i] * 32768;
      }
      return {
        data: encodeBase64(new Uint8Array(int16.buffer)),
        mimeType: 'audio/pcm;rate=16000',
      };
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorAlert.classList.remove('hidden');
    }

    function hideError() {
      errorAlert.classList.add('hidden');
    }

    function updateUIStatus() {
      if (isConnecting) {
        apiKeyInput.style.display = 'none';
        voiceSelect.disabled = true;
        styleSelect.disabled = true;
        targetLangSelect.disabled = true;
        statusBadge.className = 'flex items-center text-sm font-medium text-amber-500 bg-amber-50 px-3 py-1 rounded-full border border-amber-200';
        statusBadge.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i>連線中...';
        
        // 連線中：保持靜止的麥克風圖示，無動畫
        controlBtn.className = 'flex items-center justify-center gap-3 bg-blue-400 text-white rounded-full px-8 py-3.5 md:py-4 text-lg font-semibold cursor-wait shadow-lg w-full max-w-sm';
        controlBtn.innerHTML = '<i data-lucide="mic"></i><span>連線中...</span>';
      } else if (isSessionActive) {
        apiKeyInput.style.display = 'none';
        welcomeScreen.style.display = 'none';
        voiceSelect.disabled = true;
        styleSelect.disabled = true;
        targetLangSelect.disabled = true;
        
        // 根據防回音狀態顯示不同的 Badge
        if (activePlaybackCount > 0) {
          statusBadge.className = 'flex items-center text-sm font-medium px-3 py-1 rounded-full border shadow-sm text-purple-600 bg-purple-50 border-purple-200';
          statusBadge.innerHTML = '<i data-lucide="volume-2" class="w-4 h-4 mr-1.5 animate-pulse"></i>AI 發音中 (麥克風暫停收音)';
        } else {
          statusBadge.className = 'flex items-center text-sm font-medium px-3 py-1 rounded-full border shadow-sm text-emerald-600 bg-emerald-50 border-emerald-200';
          statusBadge.innerHTML = '<span class="relative flex h-2.5 w-2.5 mr-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-emerald-400"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span></span>聆聽中...';
        }

        // 即時偵測中：按鈕變成紅色並加入呼吸燈動畫 (animate-pulse)
        controlBtn.className = 'flex items-center justify-center gap-3 bg-red-500 hover:bg-red-600 text-white rounded-full px-8 py-3.5 md:py-4 text-lg font-semibold transition-all shadow-lg shadow-red-500/30 w-full max-w-sm animate-pulse';
        controlBtn.innerHTML = '<i data-lucide="mic-off"></i><span>停止翻譯</span>';
      } else {
        apiKeyInput.style.display = 'block';
        voiceSelect.disabled = false;
        styleSelect.disabled = false;
        targetLangSelect.disabled = false;
        statusBadge.className = 'flex items-center text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200';
        statusBadge.innerHTML = '待機中';
        
        // 待機狀態：保持靜止，移除縮放等干擾動畫
        controlBtn.className = 'flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full px-8 py-3.5 md:py-4 text-lg font-semibold transition-colors shadow-lg shadow-blue-600/30 w-full max-w-sm';
        controlBtn.innerHTML = '<i data-lucide="mic"></i><span>開始語音翻譯</span>';
      }
      lucide.createIcons();
    }

    function addTranscriptElement(id, inputText, outputText) {
      const div = document.createElement('div');
      div.id = `transcript-${id}`;
      div.className = 'flex flex-col gap-2 mb-4 animate-fade-in';
      
      // 無論輸入或輸出，都經過繁體轉換過濾 (英文不會受影響)
      const displayInputText = inputText ? cn2tw(inputText) : '';
      const displayOutputText = outputText ? cn2tw(outputText) : '';
      
      let htmlContent = '';
      
      if (displayInputText) {
        htmlContent += `
          <div class="flex justify-end">
            <div class="bg-blue-600 text-white px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] shadow-sm">
              <p class="text-base leading-relaxed">${displayInputText}</p>
            </div>
          </div>
        `;
      }
      
      if (displayOutputText) {
        htmlContent += `
          <div class="flex justify-start items-end gap-2 mt-1">
            <div class="bg-white border border-slate-200 text-slate-800 px-5 py-3 rounded-2xl rounded-tl-sm max-w-[85%] shadow-sm flex flex-col gap-1">
               <div class="flex items-center gap-1.5 text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-1">
                 <i data-lucide="languages" class="w-3 h-3"></i>
                 Translation
               </div>
              <p class="text-base leading-relaxed font-medium">${displayOutputText}</p>
            </div>
          </div>
        `;
      }
      
      div.innerHTML = htmlContent;
      transcriptContainer.appendChild(div);
      lucide.createIcons({ root: div });
      
      transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
    }

    async function startSession() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        showError('請先輸入您的 Gemini API Key。');
        return;
      }
      localStorage.setItem('gemini_api_key_html', apiKey);
      
      hideError();
      isConnecting = true;
      activePlaybackCount = 0;
      updateUIStatus();

      try {
        const ai = new GoogleGenAI({ apiKey: apiKey });

        inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        outputAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        nextStartTime = 0;

        const workletCode = `
          class RecorderProcessor extends AudioWorkletProcessor {
            process(inputs, outputs, parameters) {
              const input = inputs[0];
              if (input.length > 0) {
                this.port.postMessage(input[0]);
              }
              return true;
            }
          }
          registerProcessor('recorder-processor', RecorderProcessor);
        `;
        const workletDataUrl = 'data:application/javascript;base64,' + btoa(workletCode);
        await inputAudioContext.audioWorklet.addModule(workletDataUrl);

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true, // 保留硬體降噪作為第一層防護
            noiseSuppression: true,
            autoGainControl: true,
          }
        });

        const outputNode = outputAudioContext.createGain();
        outputNode.connect(outputAudioContext.destination);

        const selectedVoice = voiceSelect.value;
        const selectedStyle = styleSelect.value;
        const targetLang = targetLangSelect.value;
        
        // 核心更新：動態注入選定的目標語言，並強調嚴格的語言隔離
        const instruction = `You are a highly skilled real-time bi-directional translator. 
Strict Rule: You must ONLY listen for and output in exactly TWO languages: Taiwanese Mandarin (Traditional Chinese) and ${targetLang}. Absolutely DO NOT output or recognize any other languages.

If the user speaks Taiwanese Mandarin (Traditional Chinese), translate it exactly into ${targetLang} and speak the ${targetLang} translation ${selectedStyle}. 
If the user speaks ${targetLang}, translate it exactly into Taiwanese Mandarin (Traditional Chinese) and speak the Chinese translation ${selectedStyle}. 

Do not answer questions, do not hold a conversation, do not add any extra commentary. Just listen and output the exact translation in the opposite language.`;

        session = ai.live.connect({
          model: 'gemini-3.1-flash-live-preview',
          config: {
            responseModalities: [Modality.AUDIO],
            systemInstruction: instruction,
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } }
            },
            inputAudioTranscription: {},
            outputAudioTranscription: {},
          },
          callbacks: {
            onopen: () => {
              isConnecting = false;
              isSessionActive = true;
              updateUIStatus();
              
              const source = inputAudioContext.createMediaStreamSource(stream);
              const recorder = new AudioWorkletNode(inputAudioContext, 'recorder-processor');

              recorder.port.onmessage = (event) => {
                let inputData = event.data;
                
                // 【核心防回音機制：Software Mute】
                // 當喇叭正在播放 AI 翻譯結果時，強制將麥克風資料清零 (傳送靜音包)
                // 這樣 Gemini 就不會聽到自己的聲音，100% 避免誤判迴圈！
                if (activePlaybackCount > 0) {
                   inputData = new Float32Array(inputData.length); // 產生全為 0 的靜音陣列
                }
                
                const pcmBlob = createBlob(inputData);
                session.then((s) => s.sendRealtimeInput({ audio: pcmBlob }));
              };

              source.connect(recorder);
              recorder.connect(inputAudioContext.destination);
            },
            onmessage: async (message) => {
              if (message.serverContent?.inputTranscription) {
                currentInputText += message.serverContent.inputTranscription.text;
              }
              if (message.serverContent?.outputTranscription) {
                currentOutputText += message.serverContent.outputTranscription.text;
              }
              
              if (message.serverContent?.turnComplete) {
                 if (currentInputText.trim() || currentOutputText.trim()) {
                    transcriptIdCounter++;
                    addTranscriptElement(transcriptIdCounter, currentInputText, currentOutputText);
                 }
                 currentInputText = '';
                 currentOutputText = '';
              }

              const base64EncodedAudioString = message.serverContent?.modelTurn?.parts[0]?.inlineData?.data;
              if (base64EncodedAudioString) {
                nextStartTime = Math.max(nextStartTime, outputAudioContext.currentTime);
                
                const audioBuffer = await decodeAudioData(
                  decodeBase64(base64EncodedAudioString),
                  outputAudioContext,
                  24000,
                  1,
                );
                
                const source = outputAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(outputNode);
                
                source.addEventListener('ended', () => {
                  audioSources.delete(source);
                  activePlaybackCount = Math.max(0, activePlaybackCount - 1);
                  updateUIStatus(); // 更新 UI 狀態，解除靜音 Badge
                });

                source.start(nextStartTime);
                nextStartTime = nextStartTime + audioBuffer.duration;
                audioSources.add(source);
                
                // 標記開始播放，啟動麥克風靜音防回音機制
                activePlaybackCount++;
                updateUIStatus(); 
              }

              if (message.serverContent?.interrupted) {
                for (const source of audioSources.values()) {
                  source.stop();
                }
                audioSources.clear();
                activePlaybackCount = 0;
                nextStartTime = 0;
                updateUIStatus();
              }
            },
            onerror: (e) => {
              console.error('Session error:', e);
              showError('連線發生錯誤，請稍後再試。');
              stopSession();
            },
            onclose: () => {
              console.log('Session closed');
              stopSession();
            },
          }
        });
        
        session.catch(err => {
          showError('連線失敗：' + (err.message || err.toString()));
          stopSession();
        });

      } catch (err) {
        console.error(err);
        showError('無法啟動連線或取得麥克風權限：' + err.message);
        stopSession();
      }
    }

    function stopSession() {
      isSessionActive = false;
      isConnecting = false;
      activePlaybackCount = 0;
      
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      
      if (inputAudioContext) {
        inputAudioContext.close();
        inputAudioContext = null;
      }
      if (outputAudioContext) {
        outputAudioContext.close();
        outputAudioContext = null;
      }
      
      for (const source of audioSources.values()) {
        source.stop();
      }
      audioSources.clear();
      
      currentInputText = '';
      currentOutputText = '';
      
      updateUIStatus();
    }

    controlBtn.addEventListener('click', () => {
      if (isConnecting) return;
      if (isSessionActive) {
        stopSession();
      } else {
        startSession();
      }
    });

  </script>
</body>
</html>
